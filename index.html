<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spades Game</title>
    <style>
        /* --- Base & Table Setup --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1e5c2b; /* Green felt */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
            user-select: none;
        }

        #game-board {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            border: 15px solid rgba(0, 0, 0, 0.1); /* Inner table edge */
        }

        /* --- UI Elements --- */
        .btn {
            background-color: #fca311;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: bold;
            color: #000;
            font-size: 16px;
        }

        #top-left-ui { position: absolute; top: 15px; left: 15px; }
        #top-right-ui { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; z-index: 30; }
        
        #dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 45px;
            background-color: rgba(0, 0, 0, 0.9);
            padding: 10px;
            border-radius: 8px;
            width: 140px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
        }

        .menu-item {
            background: none;
            border: none;
            color: white;
            padding: 8px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid #444;
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:hover { color: #fca311; }

        #scoreboard {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.4);
        }
        #scoreboard h3 { margin: 0 0 10px 0; color: #fca311; text-align: center; font-size: 16px; }
        .score-row { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 5px; }

        #turn-prompt {
            position: absolute;
            bottom: 240px; /* Moved up to clear cards */
            background-color: rgba(0, 0, 0, 0.8);
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 15px;
            z-index: 10;
            pointer-events: none; /* Allows clicking through the prompt */
            transition: background-color 0.3s;
        }

        /* --- Player Areas --- */
        .player-area {
            position: absolute;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid #ccc;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            margin-bottom: 5px;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.3);
        }

        .player-stats { font-size: 13px; line-height: 1.4; background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 4px;}
        
        #player-top { top: 20px; left: 50%; transform: translateX(-50%); }
        #player-bottom { bottom: 20px; left: 50%; transform: translateX(-50%); }
        #player-left { left: 20px; top: 50%; transform: translateY(-50%); flex-direction: row; gap: 20px; }
        #player-right { right: 20px; top: 50%; transform: translateY(-50%); flex-direction: row-reverse; gap: 20px; }

        /* --- Cards --- */
        .card-back {
            width: 50px;
            height: 75px;
            background-color: #6a040f;
            border: 2px solid white;
            border-radius: 6px;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255,255,255,0.1) 5px, rgba(255,255,255,0.1) 10px);
            box-shadow: 1px 1px 3px rgba(0,0,0,0.4);
        }

        .card-face {
            width: 70px;
            height: 105px;
            background-color: white;
            border: 1px solid #999;
            border-radius: 6px;
            color: black;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s, margin-top 0.2s;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
        }

        .card-face:hover { transform: translateY(-15px); }
        .card-face.red { color: #d00000; }
        
        /* Corner Indices Styling */
        .card-value-top {
            position: absolute; top: 4px; left: 4px;
            display: flex; flex-direction: column; align-items: center;
            font-size: 14px; font-weight: bold; line-height: 1;
        }
        .card-value-bottom {
            position: absolute; bottom: 4px; right: 4px;
            display: flex; flex-direction: column; align-items: center;
            font-size: 14px; font-weight: bold; line-height: 1;
            transform: rotate(180deg);
        }
        .card-center-suit {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
        }

        /* Card container styles */
        .hand-horizontal { display: flex; gap: -20px; }
        .hand-horizontal .card-back { margin-left: -25px; }
        .hand-horizontal .card-back:first-child { margin-left: 0; }
        
        .hand-vertical { display: flex; flex-direction: column; gap: -40px; }
        .hand-vertical .card-back { margin-top: -55px; width: 75px; height: 50px; }
        .hand-vertical .card-back:first-child { margin-top: 0; }
        
        .my-hand { display: flex; gap: -20px; margin-top: 15px; } 
        .my-hand .card-face { margin-left: -30px; }
        .my-hand .card-face:first-child { margin-left: 0; }

        /* Center Play Area */
        #play-area {
            position: absolute;
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .played-card {
            position: absolute;
            pointer-events: none;
            margin: 0 !important;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="game-board">
        <!-- Top UI -->
        <div id="top-left-ui">
            <button class="btn" style="background-color: #8a2be2; color: white;">🚪 Exit</button>
        </div>
        
        <div id="top-right-ui">
            <button id="sound-btn" class="btn">🔊</button>
            <div style="position: relative;">
                <button id="menu-btn" class="btn">☰</button>
                <div id="dropdown-menu">
                    <button class="menu-item">Settings</button>
                    <button class="menu-item">How to Play</button>
                    <button class="menu-item">Leave Table</button>
                </div>
            </div>
        </div>

        <!-- Helen (Top Player) -->
        <div id="player-top" class="player-area">
            <div class="avatar-container">
                <div class="avatar">👩🏻</div>
                <div class="player-stats">Helen<br>0/1 Tricks</div>
            </div>
            <div class="hand-horizontal">
                <script>for(let i=0; i<13; i++) document.write('<div class="card-back"></div>');</script>
            </div>
        </div>

        <!-- Frank (Left Player) -->
        <div id="player-left" class="player-area">
            <div class="avatar-container">
                <div class="avatar">🧔🏽‍♂️</div>
                <div class="player-stats">Frank<br>0/2 Tricks</div>
            </div>
            <div class="hand-vertical">
                <script>for(let i=0; i<13; i++) document.write('<div class="card-back"></div>');</script>
            </div>
        </div>

        <!-- Alice (Right Player) -->
        <div id="player-right" class="player-area">
            <div class="avatar-container">
                <div class="avatar">👱🏼‍♀️</div>
                <div class="player-stats">Alice<br>2/3 Tricks</div>
            </div>
            <div class="hand-vertical">
                <script>for(let i=0; i<13; i++) document.write('<div class="card-back"></div>');</script>
            </div>
        </div>

        <!-- Center Play Area -->
        <div id="play-area"></div>

        <!-- Turn Prompt -->
        <div id="turn-prompt">Your turn! Click a card to play.</div>

        <!-- You (Bottom Player) -->
        <div id="player-bottom" class="player-area">
            <div class="my-hand" id="my-cards">
                <!-- Javascript will populate the hand here to keep HTML clean -->
            </div>
            <div class="avatar-container" style="margin-top: 20px; flex-direction: row; gap: 15px;">
                <div class="avatar">😎</div>
                <div class="player-stats" style="text-align: left;">
                    You<br><span id="user-trick-text">1/3 Tricks</span>
                </div>
            </div>
        </div>

        <!-- Scoreboard -->
        <div id="scoreboard">
            <h3>Current Score</h3>
            <div class="score-row">
                <span>You & Helen</span>
                <span id="user-score-text">272 (2 bags)</span>
            </div>
            <div class="score-row">
                <span>Frank & Alice</span>
                <span>149 (9 bags)</span>
            </div>
        </div>
    </div>

    <!-- Game Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- UI Menus ---
            const soundBtn = document.getElementById('sound-btn');
            let isMuted = false;
            soundBtn.addEventListener('click', () => {
                isMuted = !isMuted;
                soundBtn.innerText = isMuted ? '🔇' : '🔊';
            });

            const menuBtn = document.getElementById('menu-btn');
            const dropdownMenu = document.getElementById('dropdown-menu');
            menuBtn.addEventListener('click', () => {
                dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
            });
            document.addEventListener('click', (event) => {
                if (event.target !== menuBtn && !dropdownMenu.contains(event.target)) {
                    dropdownMenu.style.display = 'none';
                }
            });

            // --- Card Generation ---
            const myHandContainer = document.getElementById('my-cards');
            const initialHand = [
                { val: 'A', suit: '♠', color: 'black' }, { val: 'K', suit: '♠', color: 'black' },
                { val: 'Q', suit: '♠', color: 'black' }, { val: '10', suit: '♠', color: 'black' },
                { val: '9', suit: '♠', color: 'black' }, { val: '7', suit: '♠', color: 'black' },
                { val: 'Q', suit: '♥', color: 'red' },   { val: '10', suit: '♥', color: 'red' },
                { val: 'A', suit: '♣', color: 'black' }, { val: '8', suit: '♣', color: 'black' },
                { val: '6', suit: '♣', color: 'black' }, { val: '4', suit: '♦', color: 'red' },
                { val: '2', suit: '♦', color: 'red' }
            ];

            initialHand.forEach(card => {
                const cardDiv = document.createElement('div');
                cardDiv.className = `card-face ${card.color === 'red' ? 'red' : ''}`;
                cardDiv.innerHTML = `
                    <div class="card-value-top">${card.val}<br>${card.suit}</div>
                    <div class="card-center-suit">${card.suit}</div>
                    <div class="card-value-bottom">${card.val}<br>${card.suit}</div>
                `;
                myHandContainer.appendChild(cardDiv);
            });

            // --- Trick & Scoring Logic ---
            const playArea = document.getElementById('play-area');
            const turnPrompt = document.getElementById('turn-prompt');
            let userTricks = 1;
            let userBid = 3;
            let baseBags = 2; 

            const myCards = document.querySelectorAll('#my-cards .card-face');
            
            myCards.forEach(card => {
                card.addEventListener('click', function() {
                    if (this.classList.contains('played') || turnPrompt.innerText !== "Your turn! Click a card to play.") return;

                    // Play User Card
                    this.style.visibility = 'hidden';
                    this.classList.add('played');
                    const playedCard = this.cloneNode(true);
                    playedCard.style.visibility = 'visible';
                    playedCard.className += ' played-card';
                    playedCard.style.bottom = '10px'; 
                    playArea.appendChild(playedCard);

                    turnPrompt.innerText = "Waiting for opponents...";
                    turnPrompt.style.backgroundColor = "rgba(150, 0, 0, 0.8)";

                    // Simulate Opponents Playing
                    setTimeout(() => {
                        const createSimulatedCard = (val, suit, color, posStyle) => {
                            const c = document.createElement('div');
                            c.className = `card-face played-card ${color}`;
                            c.innerHTML = `
                                <div class="card-value-top">${val}<br>${suit}</div>
                                <div class="card-center-suit">${suit}</div>
                                <div class="card-value-bottom">${val}<br>${suit}</div>`;
                            Object.assign(c.style, posStyle);
                            playArea.appendChild(c);
                        };

                        createSimulatedCard('4', '♣', '', { left: '10px', top: '50px' }); // Left
                        createSimulatedCard('9', '♣', '', { top: '10px' });               // Top
                        createSimulatedCard('2', '♣', '', { right: '10px', top: '50px' });// Right

                        // Resolve Trick
                        setTimeout(() => {
                            playArea.innerHTML = ''; // Clear table
                            
                            // Update Score Logic
                            userTricks++;
                            document.getElementById('user-trick-text').innerText = `${userTricks}/${userBid} Tricks`;
                            
                            // Calculate bags if tricks exceed bid
                            if(userTricks > userBid) {
                                let totalBags = baseBags + (userTricks - userBid);
                                document.getElementById('user-score-text').innerText = `272 (${totalBags} bags)`;
                            }

                            turnPrompt.innerText = "Your turn! Click a card to play.";
                            turnPrompt.style.backgroundColor = "rgba(0, 0, 0, 0.8)";
                        }, 2000);

                    }, 800);
                });
            });
        });
    </script>
</body>
</html>
