<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spades</title>
    <style>
        /* --- Base & Table Setup --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1e5c2b; /* Green felt background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
            user-select: none;
        }

        #game-board {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- UI Elements --- */
        .btn {
            background-color: #fca311;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: bold;
            color: #000;
        }

        #top-left-ui { position: absolute; top: 10px; left: 10px; }
        #top-right-ui { position: absolute; top: 10px; right: 10px; display: flex; gap: 10px; }
        
        #scoreboard {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }
        #scoreboard h3 { margin: 0 0 10px 0; color: #fca311; text-align: center; font-size: 16px; }
        .score-row { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 5px; }

        #turn-prompt {
            position: absolute;
            bottom: 160px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 10;
        }

        /* --- Player Areas --- */
        .player-area {
            position: absolute;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid white;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .player-stats { font-size: 12px; line-height: 1.4; }
        
        #player-top { top: 20px; left: 50%; transform: translateX(-50%); }
        #player-bottom { bottom: 20px; left: 50%; transform: translateX(-50%); }
        
        /* Side players layout adjustments */
        #player-left { left: 20px; top: 50%; transform: translateY(-50%); flex-direction: row; gap: 15px; }
        #player-right { right: 20px; top: 50%; transform: translateY(-50%); flex-direction: row-reverse; gap: 15px; }

        /* --- Cards --- */
        .card-back {
            width: 45px;
            height: 65px;
            background-color: #b22222;
            border: 2px solid white;
            border-radius: 4px;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255,255,255,0.1) 5px, rgba(255,255,255,0.1) 10px);
        }

        .card-face {
            width: 60px;
            height: 90px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 6px;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
            background-size: cover;
        }

        .card-face:hover { transform: translateY(-10px); }
        .card-face.red { color: red; }

        /* Card container styles */
        .hand-horizontal { display: flex; gap: 2px; }
        .hand-vertical { display: flex; flex-direction: column; gap: 2px; }
        .my-hand { display: flex; gap: -30px; margin-top: 10px; } /* Overlapping for player hand */
        .my-hand .card-face { margin-left: -20px; }
        .my-hand .card-face:first-child { margin-left: 0; }

        /* Center Play Area */
        #play-area {
            position: absolute;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .played-card {
            position: absolute;
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <div id="game-board">
        <!-- Top UI -->
        <div id="top-left-ui">
            <button class="btn" style="background-color: #8a2be2; color: white;">🚪 Exit</button>
        </div>
        <div id="top-right-ui">
            <button class="btn">🔊</button>
            <button class="btn">☰</button>
        </div>

        <!-- Helen (Top Player) -->
        <div id="player-top" class="player-area">
            <div class="avatar-container">
                <div class="avatar">👩</div>
                <div class="player-stats">Helen<br>0/1 Tricks</div>
            </div>
            <div class="hand-horizontal">
                <!-- 13 Card Backs -->
                <script>for(let i=0; i<13; i++) document.write('<div class="card-back"></div>');</script>
            </div>
        </div>

        <!-- Frank (Left Player) -->
        <div id="player-left" class="player-area">
            <div class="avatar-container">
                <div class="avatar">👨</div>
                <div class="player-stats">Frank<br>0/2 Tricks</div>
            </div>
            <div class="hand-vertical">
                <script>for(let i=0; i<13; i++) document.write('<div class="card-back" style="width: 65px; height: 15px;"></div>');</script>
            </div>
        </div>

        <!-- Alice (Right Player) -->
        <div id="player-right" class="player-area">
            <div class="avatar-container">
                <div class="avatar">👱‍♀️</div>
                <div class="player-stats">Alice<br>2/3 Tricks</div>
            </div>
            <div class="hand-vertical">
                <script>for(let i=0; i<13; i++) document.write('<div class="card-back" style="width: 65px; height: 15px;"></div>');</script>
            </div>
        </div>

        <!-- Center Play Area -->
        <div id="play-area">
            <!-- Example of a card already played by Top player -->
            <div class="card-face played-card" style="top: 20px;">5 ♣</div>
        </div>

        <!-- Turn Prompt -->
        <div id="turn-prompt">Your turn! Click a card to play.</div>

        <!-- You (Bottom Player) -->
        <div id="player-bottom" class="player-area">
            <div class="my-hand" id="my-cards">
                <!-- 13 Interactive Cards -->
                <div class="card-face" data-card="7♠">7 ♠</div>
                <div class="card-face" data-card="8♠">8 ♠</div>
                <div class="card-face" data-card="9♠">9 ♠</div>
                <div class="card-face" data-card="10♠">10 ♠</div>
                <div class="card-face" data-card="J♠">J ♠</div>
                <div class="card-face" data-card="Q♠">Q ♠</div>
                <div class="card-face red" data-card="A♥">A ♥</div>
                <div class="card-face red" data-card="K♥">K ♥</div>
                <div class="card-face red" data-card="Q♥">Q ♥</div>
                <div class="card-face" data-card="J♣">J ♣</div>
                <div class="card-face" data-card="10♣">10 ♣</div>
                <div class="card-face red" data-card="2♦">2 ♦</div>
                <div class="card-face red" data-card="4♦">4 ♦</div>
            </div>
            <div class="avatar-container" style="margin-top: 15px; flex-direction: row; gap: 10px;">
                <div class="avatar">😎</div>
                <div class="player-stats" style="text-align: left;">You<br>1/3 Tricks</div>
            </div>
        </div>

        <!-- Scoreboard -->
        <div id="scoreboard">
            <h3>Current Score</h3>
            <div class="score-row">
                <span>You & Helen</span>
                <span>272 (2 bags)</span>
            </div>
            <div class="score-row">
                <span>Frank & Alice</span>
                <span>149 (9 bags)</span>
            </div>
        </div>
    </div>

    <!-- Game Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const myCards = document.querySelectorAll('#my-cards .card-face');
            const playArea = document.getElementById('play-area');
            const turnPrompt = document.getElementById('turn-prompt');

            myCards.forEach(card => {
                card.addEventListener('click', function() {
                    // Prevent playing multiple cards
                    if (this.classList.contains('played')) return;

                    // Remove card from hand visually
                    this.style.visibility = 'hidden';
                    this.classList.add('played');
                    
                    // Create a clone to put in the center
                    const playedCard = this.cloneNode(true);
                    playedCard.style.visibility = 'visible';
                    playedCard.className = 'card-face played-card';
                    
                    // Keep red text styling if applicable
                    if (this.classList.contains('red')) {
                        playedCard.classList.add('red');
                    }

                    // Position it at the bottom of the center pile
                    playedCard.style.bottom = '20px';
                    playedCard.style.margin = '0';
                    
                    playArea.appendChild(playedCard);

                    // Update UI prompt to show the turn is over
                    turnPrompt.innerText = "Waiting for opponents...";
                    turnPrompt.style.backgroundColor = "rgba(150, 0, 0, 0.7)";
                });
            });
        });
    </script>
</body>
</html>
